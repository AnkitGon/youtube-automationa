[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tube-assistant"
version = "1.0.0"
description = "Autonomous YouTube content pipeline — script → TTS → clips → montage → upload"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "ollama>=0.2.0",
    "edge-tts>=6.1.9",
    "requests>=2.31.0",
    "moviepy>=1.0.3",
    "Pillow>=10.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-telegram-bot>=22.0",
    "ddgs>=9.0.0",
    "gTTS>=2.5.0",
    "rich>=13.0.0",
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "google-generativeai>=0.7.0",
    "mistralai>=1.0.0",
    "groq>=0.9.0",
    "cohere>=5.0.0",
]

[project.scripts]
tube-assistant = "youtube_ai_agent.cli:main"

# Install both youtube_ai_agent/ (CLI) and moduli/ (core logic) as top-level packages.
# This means `from moduli.xxx import yyy` continues to work unchanged in all modules.
[tool.setuptools.packages.find]
where = ["."]
include = ["moduli*", "youtube_ai_agent*"]

[tool.setuptools.package-data]
"youtube_ai_agent" = ["assets/**/*", "template/**/*"]
